<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Important Question for Baba!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 340px;
            width: 90%;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 60px;
            align-items: center;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            touch-action: none;
        }
        #yes-btn {
            background-color: #2ecc71;
            color: white;
            z-index: 2;
        }
        #no-btn {
            background-color: #e74c3c;
            color: white;
            transition: left 0.1s ease, top 0.1s ease;
            z-index: 10;
            position: static; /* Starts normal so it doesn't cover Yes */
        }
        .success-message {
            display: none;
            color: #27ae60;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>Baba, will you buy me an iPhone? 📱✨</h1>
        <div class="buttons">
            <button id="yes-btn" onclick="sayYes()">Yes!</button>
            <button id="no-btn" onmouseover="moveNo()" ontouchstart="moveNo(event)" onclick="preventClick(event)">No</button>
        </div>
        <div id="success" class="success-message">Yay! Best Baba ever! ❤️🎉</div>
    </div>

 <audio id="celebration-sound" src="https://wikimedia.org" preload="auto"></audio>
   <!-- Clean, network-free sound system using built-in browser synthesizer -->
   <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        document.addEventListener('touchstart', initAudio, { once: true });
        document.addEventListener('click', initAudio, { once: true });

        function moveNo(event) {
            if (event) event.preventDefault();
            initAudio();

            const noBtn = document.getElementById('no-btn');
            const padding = 20;
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding * 2) + padding;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding * 2) + padding;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function preventClick(event) {
            event.preventDefault();
            moveNo(event);
        }

        // Synthesizes a rapid, multi-note retro victory arcade tune!
        function playCelebrationTune() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                
                // Array of notes to play sequentially [Frequency, Start Time, Duration]
                const notes = [
                    [261.63, 0.0, 0.1],  // C4
                    [329.63, 0.1, 0.1],  // E4
                    [392.00, 0.2, 0.1],  // G4
                    [523.25, 0.3, 0.15], // C5
                    [392.00, 0.45, 0.1], // G4
                    [523.25, 0.55, 0.4]  // Long triumphant C5!
                ];

                notes.forEach(([freq, delay, duration]) => {
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + delay);
                    
                    gainNode.gain.setValueAtTime(0.2, now + delay);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + delay + duration);
                    
                    osc.start(now + delay);
                    osc.stop(now + delay + duration);
                });
            } catch (error) {
                console.log("Audio failed:", error);
            }
        }

        // Creates a shower of real-time falling colorful paper pieces on the screen
        function createConfettiBurst() {
            const colors = ['#f2d74e', '#95c3de', '#b963ff', '#ff9a9e', '#57cc99'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.style.width = Math.random() * 8 + 6 + 'px';
                confetti.style.height = Math.random() * 8 + 12 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.position = 'fixed';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-5vh';
                confetti.style.borderRadius = '2px';
                confetti.style.opacity = Math.random();
                confetti.style.zIndex = '999';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                document.body.appendChild(confetti);

                // Animate down the screen
                const speed = Math.random() * 3 + 2;
                let currentTop = -5;
                
                const fallInterval = setInterval(() => {
                    currentTop += speed;
                    confetti.style.top = currentTop + 'vh';
                    if (currentTop > 100) {
                        clearInterval(fallInterval);
                        confetti.remove();
                    }
                }, 20);
            }
        }

        function sayYes() {
            document.querySelector('.buttons').style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            
            // Fire both visual and audio celebration mechanics simultaneously
            playCelebrationTune();
            createConfettiBurst();
        }
    </script>
    

       
</body>
</html>
