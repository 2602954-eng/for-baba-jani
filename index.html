<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Important Question for Baba!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 340px;
            width: 90%;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 60px;
            align-items: center;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            touch-action: none;
        }
        #yes-btn {
            background-color: #2ecc71;
            color: white;
            z-index: 2;
        }
        #no-btn {
            background-color: #e74c3c;
            color: white;
            transition: left 0.1s ease, top 0.1s ease;
            z-index: 10;
            position: static; /* Starts normal so it doesn't cover Yes */
        }
        .success-message {
            display: none;
            color: #27ae60;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>Baba, will you buy me an iPhone? 📱✨</h1>
        <div class="buttons">
            <button id="yes-btn" onclick="sayYes()">Yes!</button>
            <button id="no-btn" onmouseover="moveNo()" ontouchstart="moveNo(event)" onclick="preventClick(event)">No</button>
        </div>
        <div id="success" class="success-message">Yay! Best Baba ever! ❤️🎉</div>
    </div>

   <audio id="celebration-sound" src="https://google.com" preload="auto"></audio>

    <script>
        function moveNo(event) {
            if (event) {
                event.preventDefault(); // Stops the mobile tap from counting as a click
            }
            const noBtn = document.getElementById('no-btn');
            
            // Generate safe random positions anywhere on the screen
            const padding = 20;
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding * 2) + padding;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding * 2) + padding;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function preventClick(event) {
            event.preventDefault();
            moveNo(event);
        }

        function sayYes() {
            document.querySelector('.buttons').style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            
            const audio = document.getElementById('celebration-sound');
            audio.play().catch(error => {
                console.log("Audio play blocked:", error);
            });
        }
    </script>
</body>
</html>
