<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Important Question for Baba!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 340px;
            width: 90%;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 60px;
            align-items: center;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            touch-action: none;
        }
        #yes-btn {
            background-color: #2ecc71;
            color: white;
            z-index: 2;
        }
        #no-btn {
            background-color: #e74c3c;
            color: white;
            transition: left 0.1s ease, top 0.1s ease;
            z-index: 10;
            position: static; /* Starts normal so it doesn't cover Yes */
        }
        .success-message {
            display: none;
            color: #27ae60;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>Baba, will you buy me an iPhone? 📱✨</h1>
        <div class="buttons">
            <button id="yes-btn" onclick="sayYes()">Yes!</button>
            <button id="no-btn" onmouseover="moveNo()" ontouchstart="moveNo(event)" onclick="preventClick(event)">No</button>
        </div>
        <div id="success" class="success-message">Yay! Best Baba ever! ❤️🎉</div>
    </div>

 <audio id="celebration-sound" src="https://wikimedia.org" preload="auto"></audio>
   <!-- Clean, network-free sound system using built-in browser synthesizer -->
  <script>
        let audioCtx = null;
        let isCelebrating = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        document.addEventListener('touchstart', initAudio, { once: true });
        document.addEventListener('click', initAudio, { once: true });

        function moveNo(event) {
            if (event) event.preventDefault();
            initAudio();

            const noBtn = document.getElementById('no-btn');
            const padding = 20;
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding * 2) + padding;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding * 2) + padding;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function preventClick(event) {
            event.preventDefault();
            moveNo(event);
        }

        // Synthesizes a full, happy celebration melody that loops multiple times!
        function playLongCelebrationTune() {
            try {
                initAudio();
                let startTime = audioCtx.currentTime;
                
                // A complete, cheerful 4-bar musical melody phrase loop
                // Format: [Note Frequency, Duration of note]
                const melody = [
                    [261.63, 0.15], [329.63, 0.15], [392.00, 0.15], [523.25, 0.3], // C, E, G, High C
                    [392.00, 0.15], [523.25, 0.4],                                 // G, High C
                    [349.23, 0.15], [440.00, 0.15], [523.25, 0.3],                 // F, A, High C
                    [392.00, 0.15], [329.63, 0.15], [261.63, 0.4]                  // G, E, C
                ];

                // Loop the entire catchy melody 4 times back-to-back (~12-15 seconds total)
                for (let loop = 0; loop < 4; loop++) {
                    let noteDelay = 0;
                    
                    melody.forEach(([freq, duration]) => {
                        const osc = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();
                        
                        osc.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                        
                        // 'triangle' waves sound softer and much more musical like a real instrument
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, startTime + noteDelay);
                        
                        gainNode.gain.setValueAtTime(0.15, startTime + noteDelay);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + noteDelay + duration);
                        
                        osc.start(startTime + noteDelay);
                        osc.stop(startTime + noteDelay + duration);
                        
                        noteDelay += duration + 0.05; // Gap space between notes
                    });
                    
                    startTime += noteDelay; // Start the next musical loop right after the last one finishes
                }
            } catch (error) {
                console.log("Audio failed:", error);
            }
        }

        // Continues showering confetti non-stop for 15 full seconds!
        function startContinuousConfetti() {
            const colors = ['#f2d74e', '#95c3de', '#b963ff', '#ff9a9e', '#57cc99'];
            
            // Create a timer to spawn fresh pieces every 150 milliseconds
            const spawnTimer = setInterval(() => {
                if (!isCelebrating) {
                    clearInterval(spawnTimer);
                    return;
                }

                const confetti = document.createElement('div');
                confetti.style.width = Math.random() * 8 + 6 + 'px';
                confetti.style.height = Math.random() * 8 + 12 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.position = 'fixed';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-5vh';
                confetti.style.borderRadius = '2px';
                confetti.style.opacity = Math.random();
                confetti.style.zIndex = '999';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                document.body.appendChild(confetti);

                const speed = Math.random() * 2 + 2;
                let currentTop = -5;
                
                const fallInterval = setInterval(() => {
                    currentTop += speed;
                    confetti.style.top = currentTop + 'vh';
                    if (currentTop > 100) {
                        clearInterval(fallInterval);
                        confetti.remove();
                    }
                }, 20);
            }, 150);

            // Automatically clean up and stop spawning after 15 seconds
            setTimeout(() => {
                isCelebrating = false;
            }, 15000);
        }

        function sayYes() {
            if (isCelebrating) return; // Prevent double clicking bugs
            isCelebrating = true;

            document.querySelector('.buttons').style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            
            // Trigger our longer, looping audio and full-screen visual celebrations
            playLongCelebrationTune();
            startContinuousConfetti();
        }
    </script>
    

       
</body>
</html>
