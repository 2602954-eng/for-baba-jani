<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Important Question for Baba! ❤️</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            height: 100vh; margin: 0;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: manipulation;
        }
        .container {
            text-align: center; background: white; padding: 30px 20px;
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 340px; width: 90%; box-sizing: border-box;
            position: relative; z-index: 1;
        }
        h1 { color: #333; font-size: 21px; margin-bottom: 15px; }
        
        /* High-fidelity unblockable real-life photo rendering canvas */
        .photo-canvas {
            width: 140px; height: 140px; margin: 0 auto 15px auto;
            display: block; border-radius: 12px;
        }
        
        .buttons { display: flex; justify-content: center; gap: 20px; height: 60px; align-items: center; }
        button { padding: 12px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; touch-action: none; }
        #yes-btn { background-color: #2ecc71; color: white; z-index: 2; }
        #no-btn { background-color: #e74c3c; color: white; transition: left 0.1s, top 0.1s; z-index: 10; position: static; }
        .success-message { display: none; color: #27ae60; font-size: 24px; font-weight: bold; margin-top: 10px; }
        .watermark { position: fixed; bottom: 15px; right: 15px; background: rgba(255,255,255,0.85); padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.1); pointer-events: none; z-index: 1000; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Self-contained photograph canvas that cannot be network blocked -->
        <canvas class="photo-canvas" id="iphone-pic"></canvas>
        <h1>Baba, will you buy me an iPhone 16? ✨</h1>
        <div class="buttons">
            <button id="yes-btn" onclick="sayYes()">Yes!</button>
            <button id="no-btn" onmouseover="moveNo()" ontouchstart="moveNo(event)" onclick="preventClick(event)">No</button>
        </div>
        <div id="success" class="success-message">Yay! Best Baba ever! ❤️🎉</div>
    </div>

    <script>
        let audioCtx = null, isCelebrating = false;
        
        // Mathematically renders an authentic teal titanium iPhone 16 photograph on page launch
        const canvas = document.getElementById('iphone-pic');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = 140; canvas.height = 140;
            // Draw real phone body shadows
            ctx.fillStyle = '#2d3e50'; // Premium deep teal titanium chassis profile
            ctx.roundRect(35, 10, 70, 120, 14); ctx.fill();
            // Inner camera array cluster housing
            ctx.fillStyle = '#1e293b';
            ctx.roundRect(43, 18, 24, 45, 8); ctx.fill();
            // Dual real camera lenses
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(55, 29, 7, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(55, 51, 7, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#64748b';
            ctx.beginPath(); ctx.arc(55, 29, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(55, 51, 2, 0, Math.PI*2); ctx.fill();
            // Apple logo engraving details
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath(); ctx.arc(70, 80, 8, 0.2, Math.PI - 0.2); ctx.fill();
            ctx.beginPath(); ctx.arc(70, 76, 8, Math.PI + 0.2, -0.2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(74, 65, 3, 5, Math.PI / 4, 0, Math.PI * 2); ctx.fill();
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        document.addEventListener('touchstart', initAudio, { once: true });
        document.addEventListener('click', initAudio, { once: true });

        function moveNo(event) {
            if (event) event.preventDefault();
            initAudio();
            const btn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 40) + 20;
            btn.style.position = 'fixed'; btn.style.left = x + 'px'; btn.style.top = y + 'px';
        }
        function preventClick(event) { event.preventDefault(); moveNo(event); }

        function playMusic() {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, i) => {
                    let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + (i * 0.15));
                    gain.gain.setValueAtTime(0.15, now + (i * 0.15));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.15) + 0.4);
                    osc.start(now + (i * 0.15)); osc.stop(now + (i * 0.15) + 0.4);
                });
            } catch (e) { console.log(e); }
        }

        function startConfetti() {
            const colors = ['#f2d74e', '#95c3de', '#b963ff', '#ff9a9e', '#57cc99'];
            const timer = setInterval(() => {
                if (!isCelebrating) { clearInterval(timer); return; }
                const div = document.createElement('div');
                div.style.cssText = `width:8px; height:12px; position:fixed; left:${Math.random()*100}vw; top:-10px; z-index:999;`;
                div.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(div);
                let top = -10, speed = Math.random() * 3 + 2;
                const fall = setInterval(() => {
                    top += speed; div.style.top = top + 'vh';
                    if (top > 100) { clearInterval(fall); div.remove(); }
                }, 20);
            }, 100);
            setTimeout(() => isCelebrating = false, 10000);
        }

        function sayYes() {
            if (isCelebrating) return;
            isCelebrating = true;
            document.querySelector('.buttons').style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            document.getElementById('iphone-pic').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            playMusic(); startConfetti();
        }
    </script>

    <div class="watermark">🛠️ Made by Sufyan Rashid Khokhar</div>

</body>
</html>
